<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нет соединения — ЭРА ЭТП</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif}
body{background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.wrap{max-width:520px}
.logo{width:120px;height:auto;margin-bottom:24px;filter:brightness(0) invert(1);opacity:.92}
h1{font-size:28px;font-weight:900;margin-bottom:12px;color:#fff}
p{font-size:15px;line-height:1.55;color:#94a3b8;margin-bottom:24px}
.btn{display:inline-block;padding:12px 28px;background:#0088cc;color:#fff;border:none;border-radius:10px;font-weight:800;font-size:15px;text-decoration:none;cursor:pointer}
.btn:hover{background:#0077b3}
.hint{margin-top:18px;font-size:12px;color:#64748b}
</style>
</head>
<body>
<div class="wrap">
    <img src="/logo-forsage-modified.png" alt="ЭРА ЭТП" class="logo">
    <h1>Нет соединения с интернетом</h1>
    <p>Площадка работает в режиме реального времени, поэтому без сети ставки и предложения сохранять нельзя. Подключитесь к Wi-Fi или мобильным данным и попробуйте снова.</p>
    <button class="btn" onclick="location.reload()">Повторить</button>
    <div class="hint">Закэшированные страницы доступны после первого посещения.</div>
</div>
</body>
</html>
